[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "name-that-llm"
version = "0.1.0"
description = "Project scaffold for classifying text by its generating LLM."
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
notebooks = ["jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I"]
